<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vraag</title>
    <link rel="stylesheet" href="css/vraag.css">
</head>
<body>

<header>
    <img src="assets/imgs/logo.png" alt="Logo" class="logo">
    <h1 class="titel">les titel</h1>
</header>

<main>

    <section class="vraag">
